* { box-sizing: border-box; }

<script>
(function () {
  "use strict";
  var RECIPES = JSON.parse(document.getElementById("data").textContent);

    state.kw = (p.get("kw") || "").split(",").filter(Boolean);

  } catch (e) {}

  function count(pred) { return RECIPES.filter(pred).length; }
  function chip(label, pressed, n, onClick) {

    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", pressed ? "true" : "false");

    b.addEventListener("click", onClick);

  }

      if (n) meals.appendChild(chip(m, state.meal === m, n, function () { state.meal = state.meal === m ? "" : m; update(); }));

      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return dir * (x - y);

    switch (state.sort) {

      case "protein": return nullLast(a.protein, b.protein, -1) || a.title.localeCompare(b.title);
      case "cal": return nullLast(a.calories, b.calories, 1) || a.title.localeCompare(b.title);
